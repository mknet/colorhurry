[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cpb",
    "crates/web",
    "crates/ffi",
]
default-members = ["crates/cpb"]

[workspace.dependencies]
# The no_std spike of Crux (redbadger/crux, branch spike/no-std).
crux_core = { git = "https://github.com/redbadger/crux", rev = "9d56ad116e61a935c4f74c5d12061917eb21f9ff", default-features = false }

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Marcel"]
license = "MIT OR Apache-2.0"

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
opt-level = 1
