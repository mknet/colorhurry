name: ColorHurry
options:
  bundleIdPrefix: com.colorhurry
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  # Generated by `just ffi-apple`: BoltFFI bindings + Crux types for the Rust core.
  App:
    path: generated/App
  Shared:
    path: generated/Shared
# Base.xcconfig reads the signing team from the gitignored Local.xcconfig.
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    # The FFI core has no x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
targets:
  ColorHurry:
    type: application
    platform: iOS
    # A shared scheme, so `xcodebuild -scheme` does not depend on Xcode user state.
    scheme: {}
    sources:
      - path: iOS
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: App
      - package: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colorhurry.app
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: ColorHurry
        INFOPLIST_FILE: iOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Color Hurry
        CFBundleName: ColorHurry
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: Color Hurry scans for Circuit Playground Bluefruit color advertisements to play as Receiver.
        NSBluetoothPeripheralUsageDescription: Color Hurry uses Bluetooth to play with nearby Color Hurry boards.
        UIBackgroundModes:
          - bluetooth-central
  ColorHurryMac:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: macOS
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: App
      - package: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colorhurry.app.mac
        PRODUCT_NAME: ColorHurry
        INFOPLIST_FILE: macOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: macOS/ColorHurryMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Color Hurry
        CFBundleName: ColorHurry
        LSApplicationCategoryType: public.app-category.games
        NSBluetoothAlwaysUsageDescription: Color Hurry scans for Circuit Playground Bluefruit color advertisements to play as Receiver.
  ColorHurryWatch:
    type: application
    platform: watchOS
    scheme: {}
    sources:
      - path: watchOS
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
          # The watch has its own screen in watchOS/WatchContentView.swift.
          - UI/ContentView.swift
    dependencies:
      - package: App
      - package: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colorhurry.app.watch
        PRODUCT_NAME: ColorHurry
        INFOPLIST_FILE: watchOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: watchOS/Info.plist
      properties:
        CFBundleDisplayName: Color Hurry
        CFBundleName: ColorHurry
        WKApplication: true
        WKWatchOnly: true
        NSBluetoothAlwaysUsageDescription: Color Hurry scans for Circuit Playground Bluefruit color advertisements to play as Receiver.
