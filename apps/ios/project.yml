name: ColorHurry
options:
  bundleIdPrefix: com.colorhurry
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  # Generated by `just ffi-ios`: BoltFFI bindings + Crux types for the Rust core.
  App:
    path: generated/App
  Shared:
    path: generated/Shared
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  ColorHurry:
    type: application
    platform: iOS
    sources:
      - path: ColorHurry
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: App
      - package: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colorhurry.app
        PRODUCT_NAME: ColorHurry
        INFOPLIST_FILE: ColorHurry/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: ColorHurry/Info.plist
      properties:
        CFBundleDisplayName: Color Hurry
        CFBundleName: ColorHurry
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: Color Hurry scans for Circuit Playground Bluefruit color advertisements to play as Receiver.
        NSBluetoothPeripheralUsageDescription: Color Hurry uses Bluetooth to play with nearby Color Hurry boards.
        UIBackgroundModes:
          - bluetooth-central
