[package]
name = "color-hurry-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Color Hurry WASM shell (browser)"
license.workspace = true
autobins = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
color-hurry-core = { path = "../core" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlButtonElement",
    "Node",
    "Window",
    "CssStyleDeclaration",
    "AudioContext",
    "OscillatorNode",
    "AudioParam",
    "GainNode",
    "AudioNode",
    "BaseAudioContext",
    "AudioDestinationNode",
] }
