[package]
name = "color-hurry-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Color Hurry core over FFI for the native iOS and Android shells (Crux bridge + BoltFFI)"
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
codegen = ["dep:anyhow", "dep:clap", "color-hurry-core/facet_typegen"]

[dependencies]
color-hurry-core = { path = "../core" }
crux_core = { path = "../../../../../crux/crux_core", features = ["bridge"] }
boltffi = "=0.30.1"
bincode = "=1.3"

anyhow = { version = "1.0", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
