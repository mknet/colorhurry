[package]
name = "color-hurry-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Color Hurry game logic (Crux App, no_std)"
license.workspace = true
autotests = false

[dependencies]
crux_core = { path = "../../../../../crux/crux_core", default-features = false, features = ["crux_macros", "critical-section"] }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
crux_core = { path = "../../../../../crux/crux_core", default-features = false, features = ["crux_macros", "critical-section", "testing"] }
cucumber = "0.21"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "shell"
path = "tests/shell.rs"
harness = false
